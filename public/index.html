<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoLag · Roblox observability</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10243a;--line:#1b3855;--text:#edf6ff;--muted:#8aa4bf;--cyan:#47d7ff;--green:#52e1a3;--amber:#ffca6b;--red:#ff7185;--shadow:0 20px 60px #0004}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#15385b 0,#07111f 40%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:252px;border-right:1px solid var(--line);padding:28px 18px;background:#081526cc;backdrop-filter:blur(16px);position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:12px;margin:0 12px 34px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#7b7cff);display:grid;place-items:center;color:#04101c;font-weight:900;box-shadow:0 8px 30px #47d7ff33}.brand strong{font-size:18px;letter-spacing:.4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;border-radius:10px;transition:.2s}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.sidebar-footer{position:absolute;bottom:24px;left:28px;right:28px;color:var(--muted);font-size:12px}.main{margin-left:252px;width:calc(100% - 252px);padding:28px 34px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:1.8px;font-weight:700}.topbar h1{margin:8px 0 0;font-size:28px;letter-spacing:-.7px}.account{display:flex;align-items:center;gap:12px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#173b5b;display:grid;place-items:center;color:var(--cyan);font-weight:700}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:9px}.btn:hover{border-color:#3b6b93}.btn.primary{background:var(--cyan);color:#03101c;border-color:var(--cyan);font-weight:700}.btn.danger{color:var(--red)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(145deg,#10233aee,#0a1728ee);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:28px;font-weight:750;margin:9px 0 4px}.delta{font-size:12px;color:var(--green)}.dashboard-grid{grid-template-columns:1.55fr 1fr;margin-top:16px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card h2{font-size:15px;margin:0}.card p{color:var(--muted);line-height:1.55}.status{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.bar-chart{height:190px;display:flex;gap:7px;align-items:end;padding:18px 2px 4px;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:5px;border-radius:5px 5px 0 0;background:linear-gradient(#47d7ff,#3988ce);opacity:.85;position:relative}.bar:hover{opacity:1}.empty{text-align:center;padding:44px 10px;color:var(--muted)}.server-row,.alert-row,.user-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #18304a}.server-row:last-child,.alert-row:last-child,.user-row:last-child{border-bottom:0}.server-name{font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:4px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px}.pill.good{background:#173b37;color:var(--green)}.pill.warn{background:#453823;color:var(--amber)}.pill.bad{background:#452733;color:var(--red)}.pill.neutral{background:#1d3148;color:var(--muted)}.page{display:none}.page.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.form{max-width:480px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:var(--muted);font-size:12px}.field input,.field select{background:#08182a;border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--text);outline:none}.field input:focus{border-color:var(--cyan)}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);padding:34px}.auth-card h1{font-size:30px;margin:15px 0 6px}.auth-card .btn{width:100%;margin-top:10px}.auth-switch{color:var(--muted);text-align:center;margin:20px 0 0}.auth-switch button{background:none;border:0;color:var(--cyan)}.notice{background:#321e27;color:#ff9aaa;border:1px solid #6c3445;padding:11px 13px;border-radius:9px;margin:12px 0;display:none}.notice.show{display:block}.mobile-menu{display:none}.toast{position:fixed;right:24px;bottom:24px;background:#17334e;border:1px solid #316388;border-radius:10px;padding:13px 16px;box-shadow:var(--shadow);display:none}.toast.show{display:block}@media(max-width:900px){.sidebar{transform:translateX(-100%);z-index:4;transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%;padding:22px 16px}.mobile-menu{display:inline-flex}.topbar{align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.account .email{display:none}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat-value{font-size:22px}.topbar h1{font-size:24px}}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const API=(localStorage.getItem('rolag_api')||'https://telemetry-data.onrender.com').replace(/\/$/,'');let token=localStorage.getItem('rolag_token');let user=JSON.parse(localStorage.getItem('rolag_user')||'null');let games=[];let selectedGame=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function authView(mode='login'){document.body.innerHTML=`<div class="auth-shell"><div class="card auth-card"><div class="brand" style="margin:0"><div class="mark">R</div><div><strong>RoLag</strong><small>Roblox observability</small></div></div><h1>${mode==='login'?'Welcome back':'Create your workspace'}</h1><p>${mode==='login'?'Monitor your Roblox servers with clarity.':'Start tracking server health in minutes.'}</p><div class="notice" id="notice"></div><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="${mode==='login'?'current-password':'new-password'}"></div><button class="btn primary" type="submit">${mode==='login'?'Sign in':'Create account'}</button></form><div class="auth-switch">${mode==='login'?"New to RoLag?":"Already have an account?"} <button id="switch">${mode==='login'?'Create an account':'Sign in'}</button></div></div></div>`;$('#switch').onclick=()=>authView(mode==='login'?'register':'login');$('#authForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(mode==='register'){toast('Account created — sign in to continue');return authView('login')}token=d.token;user=d.user;localStorage.setItem('rolag_token',token);localStorage.setItem('rolag_user',JSON.stringify(user));render()}catch(err){$('#notice').textContent=err.message;$('#notice').classList.add('show')}}}
function render(){if(!token){authView();return}document.body.innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">R</div><div><strong>RoLag</strong><small>Roblox observability</small></div></div><nav class="nav"><button class="active" data-page="overview">▦ &nbsp; Overview</button><button data-page="servers">◉ &nbsp; Live servers</button><button data-page="metrics">⌁ &nbsp; Metrics</button><button data-page="alerts">! &nbsp; Alerts</button><button data-page="games">▣ &nbsp; Games</button><button data-page="settings">⚙ &nbsp; Preferences</button>${user.role==='superadmin'?'<button data-page="admin">♜ &nbsp; Admin</button>':''}</nav><div class="sidebar-footer">API <span class="status"><span class="dot"></span> connected</span><br><span style="display:inline-block;margin-top:10px">v2.0 · server-side estimates</span></div></aside><main class="main"><div class="topbar"><div><button class="btn mobile-menu" id="menu">☰</button><div class="eyebrow">Operations console</div><h1 id="pageTitle">Overview</h1></div><div class="account"><span class="email">${esc(user.email)}</span><span class="avatar">${esc(user.email[0].toUpperCase())}</span><button class="btn" id="logout">Log out</button></div></div><section id="pages"><div class="page active" id="overview"></div><div class="page" id="servers"></div><div class="page" id="metrics"></div><div class="page" id="alerts"></div><div class="page" id="games"></div><div class="page" id="settings"></div>${user.role==='superadmin'?'<div class="page" id="admin"></div>':''}</section></main></div>`;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('#logout').onclick=()=>{localStorage.clear();token=null;user=null;authView()};$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');loadGames();}
async function loadGames(){try{games=await api('/games');selectedGame=selectedGame&&games.find(g=>g.gameId===selectedGame.gameId)||games[0]||null;renderOverview();}catch(e){toast(e.message)}}
function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===page));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').textContent=page[0].toUpperCase()+page.slice(1);if(page==='overview')renderOverview();if(page==='servers')renderServers();if(page==='metrics')renderMetrics();if(page==='alerts')renderAlerts();if(page==='games')renderGames();if(page==='settings')renderSettings();if(page==='admin')renderAdmin();$('#sidebar').classList.remove('open')}
function gamePicker(){return `<select id="gamePicker" class="btn" style="padding:8px 10px"><option value="">${games.length?'Select game':'No games registered'}</option>${games.map(g=>`<option value="${esc(g.gameId)}" ${selectedGame?.gameId===g.gameId?'selected':''}>${esc(g.name||g.gameId)}</option>`).join('')}</select>`}
async function metrics(){return selectedGame?api('/metrics/'+encodeURIComponent(selectedGame.gameId)):[]}
function renderOverview(){const el=$('#overview');if(!el)return;el.innerHTML=`<div class="grid stats"><div class="card"><div class="stat-label">Live servers</div><div class="stat-value" id="liveCount">—</div><div class="delta">real-time presence</div></div><div class="card"><div class="stat-label">Average FPS</div><div class="stat-value" id="avgFps">—</div><div class="delta">server estimate</div></div><div class="card"><div class="stat-label">Players online</div><div class="stat-value" id="players">—</div><div class="delta">across selected game</div></div><div class="card"><div class="stat-label">Tracked games</div><div class="stat-value">${games.length}</div><div class="delta">owned by you</div></div></div><div class="grid dashboard-grid"><div class="card"><div class="card-head"><div><h2>FPS pulse</h2><div class="sub">Recent server-side FPS estimates</div></div>${gamePicker()}</div><div class="bar-chart" id="chart"><div class="empty">Select a game to see telemetry.</div></div><p>RoLag measures the Roblox server’s estimated simulation FPS. It does not represent every player’s client FPS.</p></div><div class="card"><div class="card-head"><h2>Live now</h2><span class="status"><span class="dot"></span> streaming</span></div><div id="liveList" class="empty">Select a game to load live servers.</div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h2>Quick start</h2><button class="btn primary" onclick="showPage('games')">Manage games</button></div><p>Register a Roblox universe, add the server-side scripts from your project, then set your Render API URL and telemetry secret in Roblox Studio.</p></div>`;$('#gamePicker').onchange=e=>{selectedGame=games.find(g=>g.gameId===e.target.value);renderOverview()};if(selectedGame)loadOverviewData()}
async function loadOverviewData(){try{const [live,ms]=await Promise.all([api('/live/'+encodeURIComponent(selectedGame.gameId)),metrics()]);$('#liveCount').textContent=live.length;$('#players').textContent=live.reduce((a,s)=>a+(s.players||0),0);$('#avgFps').textContent=ms.length?Math.round(ms.reduce((a,m)=>a+Number(m.fps||0),0)/ms.length):'—';const recent=ms.slice(0,24).reverse();$('#chart').innerHTML=recent.length?recent.map(m=>`<div class="bar" style="height:${Math.max(8,Math.min(100,Number(m.fps||0)/60*100))}%" title="${m.fps} FPS · ${new Date(m.time).toLocaleTimeString()}"></div>`).join(''):'<div class="empty">No telemetry yet.</div>';$('#liveList').innerHTML=live.length?live.map(s=>`<div class="server-row"><div><div class="server-name">${esc(s.serverId.slice(0,18))}</div><div class="sub">${s.players||0} players · ${s.memoryMb?Math.round(s.memoryMb)+' MB':'memory n/a'}</div></div><span class="pill ${s.fps<30?'bad':s.fps<50?'warn':'good'}">${Math.round(s.fps)} FPS</span></div>`).join(''):'<div class="empty">No active servers</div>'}catch(e){toast(e.message)}}
async function renderServers(){const el=$('#servers');el.innerHTML=`<div class="card"><div class="card-head"><div><h2>Live servers</h2><div class="sub">Last update within ${Math.round(30000/1000)} seconds</div></div>${gamePicker()}</div><div id="serverTable" class="empty">Loading…</div></div>`;$('#gamePicker').onchange=e=>{selectedGame=games.find(g=>g.gameId===e.target.value);renderServers()};if(!selectedGame)return;try{const live=await api('/live/'+encodeURIComponent(selectedGame.gameId));$('#serverTable').innerHTML=live.length?live.map(s=>`<div class="server-row"><div><div class="server-name">${esc(s.serverId)}</div><div class="sub">Updated ${new Date(s.time||Date.now()).toLocaleTimeString()} · ${s.players||0} players · ${s.memoryMb?Math.round(s.memoryMb)+' MB':'memory n/a'}</div></div><span class="pill ${s.fps<30?'bad':s.fps<50?'warn':'good'}">${Math.round(s.fps)} FPS</span></div>`).join(''):'<div class="empty">No active servers. Check your Roblox HttpService configuration.</div>'}catch(e){toast(e.message)}}
async function renderMetrics(){const el=$('#metrics');el.innerHTML=`<div class="card"><div class="card-head"><div><h2>Historical metrics</h2><div class="sub">FPS, players, memory and uptime</div></div>${gamePicker()}</div><div id="metricTable" class="empty">Loading…</div></div>`;$('#gamePicker').onchange=e=>{selectedGame=games.find(g=>g.gameId===e.target.value);renderMetrics()};if(!selectedGame)return;try{const ms=await metrics();$('#metricTable').innerHTML=ms.length?`<table class="table"><thead><tr><th>Time</th><th>Server</th><th>FPS</th><th>Players</th><th>Memory</th></tr></thead><tbody>${ms.slice(0,100).map(m=>`<tr><td>${new Date(m.time).toLocaleString()}</td><td>${esc(m.serverId.slice(0,22))}</td><td><span class="pill ${m.fps<30?'bad':m.fps<50?'warn':'good'}">${Math.round(m.fps)}</span></td><td>${m.players}</td><td>${m.memoryMb?Math.round(m.memoryMb)+' MB':'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No metrics recorded yet.</div>'}catch(e){toast(e.message)}}
async function renderAlerts(){const el=$('#alerts');el.innerHTML=`<div class="card"><div class="card-head"><div><h2>Alert history</h2><div class="sub">Performance drops based on your preferences</div></div>${gamePicker()}</div><div id="alertList" class="empty">Loading…</div></div>`;$('#gamePicker').onchange=e=>{selectedGame=games.find(g=>g.gameId===e.target.value);renderAlerts()};if(!selectedGame)return;try{const a=await api('/alerts/'+encodeURIComponent(selectedGame.gameId));$('#alertList').innerHTML=a.length?a.map(x=>`<div class="alert-row"><div><div class="server-name">${esc(x.message)}</div><div class="sub">${new Date(x.time).toLocaleString()}</div></div><span class="pill bad">low FPS</span></div>`).join(''):'<div class="empty">No alerts for this game.</div>'}catch(e){toast(e.message)}}
function renderGames(){const el=$('#games');el.innerHTML=`<div class="grid dashboard-grid"><div class="card"><div class="card-head"><h2>Your games</h2><button class="btn primary" onclick="document.querySelector('#gameForm').scrollIntoView()">Add game</button></div>${games.length?games.map(g=>`<div class="server-row"><div><div class="server-name">${esc(g.name||g.gameId)}</div><div class="sub">Universe / game ID: ${esc(g.gameId)}</div></div><button class="btn danger" onclick="deleteGame('${encodeURIComponent(g.gameId)}')">Remove</button></div>`).join(''):'<div class="empty">Register your first Roblox game.</div>'}</div><div class="card form"><h2>Register a game</h2><p>Use the Roblox universe ID as the stable game identifier.</p><form id="gameForm"><div class="field"><label>Game ID</label><input id="newGameId" required placeholder="123456789"></div><div class="field"><label>Display name</label><input id="newGameName" placeholder="My Roblox experience"></div><button class="btn primary">Register game</button></form><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><button class="btn" onclick="exportData()">Export my data</button> <label class="btn" style="display:inline-block">Import<input type="file" id="importFile" accept="application/json" hidden></label></div></div>`;$('#gameForm').onsubmit=async e=>{e.preventDefault();try{await api('/register-game',{method:'POST',body:JSON.stringify({gameId:$('#newGameId').value,name:$('#newGameName').value})});toast('Game registered');await loadGames();showPage('games')}catch(err){toast(err.message)}};$('#importFile').onchange=importData}
async function deleteGame(id){if(!confirm('Remove this game from your workspace?'))return;try{await api('/games/'+id,{method:'DELETE'});await loadGames();showPage('games');toast('Game removed')}catch(e){toast(e.message)}}
async function exportData(){try{const d=await api('/me/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='rolag-export.json';a.click();toast('Export downloaded')}catch(e){toast(e.message)}}
async function importData(e){try{const d=JSON.parse(await e.target.files[0].text());const r=await api('/me/import',{method:'POST',body:JSON.stringify(d)});toast(`${r.imported} games imported`);loadGames()}catch(err){toast(err.message)}}
async function renderSettings(){const p=await api('/me/prefs');$('#settings').innerHTML=`<div class="card form"><h2>Alert preferences</h2><p>These settings only affect alerts for your account.</p><form id="prefs"><div class="field"><label><input id="enabled" type="checkbox" ${p.enabled?'checked':''}> Enable alerts</label></div><div class="field"><label>Minimum FPS threshold</label><input id="minFps" type="number" min="1" max="240" value="${p.minFps||30}"></div><div class="field"><label>Cooldown (seconds)</label><input id="cooldown" type="number" min="10" value="${p.cooldown||60}"></div><div class="field"><label><input id="emailEnabled" type="checkbox" ${p.emailEnabled!==false?'checked':''}> Email notifications</label></div><div class="field"><label><input id="dashboardEnabled" type="checkbox" ${p.dashboardEnabled!==false?'checked':''}> Dashboard notifications</label></div><button class="btn primary">Save preferences</button></form></div>`;$('#prefs').onsubmit=async e=>{e.preventDefault();try{await api('/me/prefs',{method:'POST',body:JSON.stringify({enabled:$('#enabled').checked,minFps:Number($('#minFps').value),cooldown:Number($('#cooldown').value),emailEnabled:$('#emailEnabled').checked,dashboardEnabled:$('#dashboardEnabled').checked})});toast('Preferences saved')}catch(err){toast(err.message)}}}
async function renderAdmin(){const el=$('#admin');el.innerHTML='<div class="grid stats"><div class="card">Loading admin metrics…</div></div>';try{const [s,u,st]=await Promise.all([api('/admin/stats'),api('/admin/users'),api('/admin/status')]);el.innerHTML=`<div class="grid stats">${[['Users',s.users],['Games',s.games],['Metrics',s.metrics],['Alerts',s.alerts]].map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="card-head"><h2>Platform controls</h2><span class="pill ${st.maintenance.enabled?'bad':'good'}">${st.maintenance.enabled?'maintenance':'operational'}</span></div><p>${esc(st.maintenance.message||'All systems operational.')}</p><button class="btn ${st.maintenance.enabled?'primary':'danger'}" id="maint">${st.maintenance.enabled?'End maintenance':'Enable maintenance'}</button></div><div class="card" style="margin-top:16px"><div class="card-head"><h2>User management</h2></div>${u.map(x=>`<div class="user-row"><div><div class="server-name">${esc(x.email)}</div><div class="sub">${x.games} games · ${new Date(x.createdAt).toLocaleDateString()}</div></div><div><span class="pill ${x.status==='banned'?'bad':'good'}">${x.status}</span> ${x.id!==user.id?`<button class="btn" onclick="toggleBan('${x.id}','${x.status}')">${x.status==='banned'?'Unban':'Ban'}</button>`:''}</div></div>`).join('')}</div>`;$('#maint').onclick=async()=>{const on=!st.maintenance.enabled;await api('/admin/maintenance/'+(on?'on':'off'),{method:'POST',body:JSON.stringify({})});renderAdmin()}}catch(e){toast(e.message)}}
async function toggleBan(id,status){try{await api('/admin/'+(status==='banned'?'unban':'ban')+'/'+id,{method:'POST'});renderAdmin()}catch(e){toast(e.message)}}
render();
</script>
</body></html>
